name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # TODO: switch to --frozen-lockfile once pnpm-lock.yaml is committed.
      - run: pnpm install

      - name: Type-check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Check no env files are committed
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$'; then
            echo "An .env file is committed. Remove it and rotate any keys inside." && exit 1
          fi
